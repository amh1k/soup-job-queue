# Used only by scripts/verify-deployment.py with a fresh disposable project.
services:
  api:
    ports: !reset []
  integration:
    image: golang:1.26.8
    profiles: [verification]
    working_dir: /src
    volumes:
      - .:/src:ro
    environment:
      TEST_DATABASE_URL: postgres://soup:soup@db:5432/soup?sslmode=disable
      GOCACHE: /tmp/go-build
    command: ["go", "test", "-race", "-count=1", "-v", "./..."]
    depends_on:
      db:
        condition: service_healthy
