x-experiment: &experiment
  build: .
  profiles: [experiments]
  init: true
  user: "${EXPERIMENT_UID:-1000}:${EXPERIMENT_GID:-1000}"
  environment:
    DATABASE_URL: postgres://soup:soup@db:5432/soup?sslmode=disable
  volumes:
    - ./results:/app/results
  depends_on:
    db:
      condition: service_healthy

x-worker: &worker
  build: .
  command: ["/app/worker"]
  init: true
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
  stop_grace_period: 15s
  environment: &worker-env
    DATABASE_URL: postgres://soup:soup@db:5432/soup?sslmode=disable
    DB_MAX_CONNS: "4"
    DB_TIMEOUT: 3s
    LEASE_DURATION: 10s
    HEARTBEAT_INTERVAL: 2s
    POLL_INTERVAL: 100ms
    RECOVERY_INTERVAL: 1s
    RECOVERY_BATCH: "100"

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: soup
      POSTGRES_USER: soup
      POSTGRES_PASSWORD: soup
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soup -d soup"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://soup:soup@db:5432/soup?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    init: true
    environment:
      DATABASE_URL: postgres://soup:soup@db:5432/soup?sslmode=disable
      HTTP_ADDR: :8080
      DB_TIMEOUT: 3s
      DB_MAX_CONNS: "10"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5
    stop_grace_period: 15s

  worker-1:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_ID: worker-1
  worker-2:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_ID: worker-2
  worker-3:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_ID: worker-3
  worker-4:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_ID: worker-4

  chaos:
    <<: *experiment
    entrypoint: ["/app/chaos", "-worker-bin", "/app/worker"]
  load:
    <<: *experiment
    entrypoint: ["/app/load", "-worker-bin", "/app/worker"]

volumes:
  postgres_data:
