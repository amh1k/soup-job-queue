services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: soup
      POSTGRES_USER: soup
      POSTGRES_PASSWORD: soup
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soup -d soup"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://soup:soup@db:5432/soup?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    init: true
    environment:
      DATABASE_URL: postgres://soup:soup@db:5432/soup?sslmode=disable
      HTTP_ADDR: :8080
      DB_TIMEOUT: 3s
      DB_MAX_CONNS: "10"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5
    stop_grace_period: 15s

volumes:
  postgres_data:
